; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; build_unflags = -Os
build_flags=
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_compat_mode = strict
lib_deps = 
	https://github.com/RobTillaart/DHT20
	https://github.com/beegee-tokyo/DHTesp
lib_extra_dirs = 
	lib
	lib/Utils
lib_ldf_mode = deep
; NOTE:
; Do NOT force a 16MB partition table on common 4MB ESP32 boards,
; it can cause continuous reboot at boot.
; If you need LittleFS, add a matching partition table for your flash size.